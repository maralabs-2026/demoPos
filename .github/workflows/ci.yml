# Validación automática de cada PR a main: tipado, lint, formato, unitarios y Playwright.
# Playwright corre contra el build de producción (next start) y la base de PRUEBAS
# (kiosko-demo-test). Los secretos del repo son todos de test: nunca cargar los de producción.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Tipado, lint, formato y unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 11 reescribe el lockfile: se instala con npm 10, igual que en local.
      - run: npx --yes npm@10.9.2 ci
      - run: npx tsc --noEmit
      - run: npx eslint src e2e scripts
      - run: npx prettier --check .
      - run: npm run test

  e2e:
    name: Playwright (build de producción, base de test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Todas las corridas comparten la base de test: de a una, sin cortar la que está en curso.
    concurrency:
      group: e2e-base-de-test
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_DUENO_PASSWORD: ${{ secrets.E2E_DUENO_PASSWORD }}
      E2E_ENCARGADO_PASSWORD: ${{ secrets.E2E_ENCARGADO_PASSWORD }}
      E2E_CAJERO_PASSWORD: ${{ secrets.E2E_CAJERO_PASSWORD }}
    steps:
      - name: La URL es la de la base de test
        run: |
          if [ "$NEXT_PUBLIC_SUPABASE_URL" != "https://nxpvhfyilruileakhldq.supabase.co" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL no es kiosko-demo-test (o falta el secreto)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes npm@10.9.2 ci
      - run: npm run build
      - name: El bundle no apunta a producción
        run: |
          if grep -rlq juhxmthxgftizbejhuuu .next/static; then
            echo "::error::El build contiene la URL de producción"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:preparar
      - run: npx playwright test
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
